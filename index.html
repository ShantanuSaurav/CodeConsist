<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devlingo — Learn to Code. Level Up for Real.</title>
  <meta name="description" content="Devlingo — the developer training environment. 200 hand-checked lessons, LeetCode-style stage tests and real code execution, in ten stages." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Prevent theme flash: the app stores the theme under cq-theme and keys
       dark mode off the .dark class (Tailwind) and data-theme (component CSS). -->
  <script>
    if (localStorage.getItem('cq-theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
